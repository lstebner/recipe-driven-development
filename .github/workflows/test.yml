name: test

on:
  push:
    branches: [main]
  pull_request:
  # release.yml starts it on the release PR's branch: a PR opened with the workflow token doesn't trigger it.
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 18 is the oldest version spec-lint.mjs supports (see README).
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: ./test/run.sh
